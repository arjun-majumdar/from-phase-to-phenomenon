<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Projector and camera stereo setup illuminating an object">
  <rect x="0" y="0" width="760" height="320" rx="16" fill="#fbfdfc"/>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="view" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- light beam from projector to object -->
  <polygon points="150,118 360,150 360,210 150,172" fill="url(#beam)"/>
  <!-- view cone from object to camera -->
  <polygon points="610,118 400,150 400,210 610,172" fill="url(#view)"/>

  <!-- projector -->
  <rect x="40" y="110" width="110" height="70" rx="10" fill="#1f2937"/>
  <rect x="150" y="132" width="16" height="26" rx="3" fill="#f59e0b"/>
  <text x="95" y="150" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="15" font-weight="700">Projector</text>
  <text x="95" y="170" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">1920 &#215; 1080</text>

  <!-- striped pattern hint on projector face -->
  <g opacity="0.5">
    <line x1="153" y1="134" x2="153" y2="156" stroke="#fff7ed" stroke-width="2"/>
    <line x1="158" y1="134" x2="158" y2="156" stroke="#9a3412" stroke-width="2"/>
    <line x1="163" y1="134" x2="163" y2="156" stroke="#fff7ed" stroke-width="2"/>
  </g>

  <!-- object -->
  <ellipse cx="380" cy="180" rx="46" ry="58" fill="#16a34a"/>
  <ellipse cx="380" cy="180" rx="46" ry="58" fill="none" stroke="#15803d" stroke-width="2"/>
  <!-- fringe lines wrapping the object -->
  <g stroke="#064e3b" stroke-width="2" opacity="0.45" fill="none">
    <path d="M340,150 q40,12 80,0"/>
    <path d="M337,172 q43,14 86,0"/>
    <path d="M340,194 q40,12 80,0"/>
    <path d="M346,214 q34,10 68,0"/>
  </g>
  <text x="380" y="262" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14" font-weight="700">Object</text>

  <!-- camera -->
  <rect x="610" y="110" width="110" height="70" rx="10" fill="#1f2937"/>
  <circle cx="610" cy="145" r="14" fill="#0d9488"/>
  <circle cx="610" cy="145" r="6" fill="#99f6e4"/>
  <text x="665" y="150" text-anchor="middle" fill="#99f6e4" font-family="sans-serif" font-size="15" font-weight="700">Camera</text>
  <text x="665" y="170" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">RGB, .exr</text>

  <!-- baseline -->
  <line x1="95" y1="195" x2="665" y2="195" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="380" y="300" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">projector &#38; camera form a stereo pair (known baseline)</text>
</svg>
